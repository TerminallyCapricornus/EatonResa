<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>Class id Demo</title>
<style>
    div {
        width: 150px;
        height: 150px;
        background-color: blue;
        border-radius: 10px;
        border: 2px solid red;
    }

    #one {
    static;
    }
    #two { position: relative;
        left: 50px;}
    #three { position: relative; left: 100px;}
    #four {position: absolute;
    background-color: blueviolet; left: 200px;}
    #five {
        position: sticky;
        top: 0;
        background-color: yellowgreen;
    }
</style>
</head>
            
<body>
<div id="one">
    <p> haha weiner</p>

</div>
<div id="five">
</div>
<div id="two">
</div>

<div id="three">
</div>
<div id="four">
</div>

</body>

</html>
